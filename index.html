<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="授業動画録画">
<title>授業動画録画アプリ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --wall:#cdd5dc; --chrome:#f4f6f8; --ink:#1e2b37; --muted:#5f6f7e; --line:#d3dae0;
  --btn:#ffffff; --on:#1e2b37; --onInk:#ffffff; --rec:#c8261f; --frame:#aeb7bf;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --wall:#262d34; --chrome:#1b2127; --ink:#e6ebf0; --muted:#9aa7b3; --line:#38424c;
    --btn:#252d35; --on:#e6ebf0; --onInk:#1b2127; --rec:#ef4a40; --frame:#4a545e;
  }
}
:root[data-theme="dark"]{
  --wall:#262d34; --chrome:#1b2127; --ink:#e6ebf0; --muted:#9aa7b3; --line:#38424c;
  --btn:#252d35; --on:#e6ebf0; --onInk:#1b2127; --rec:#ef4a40; --frame:#4a545e;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--chrome)}
/* Safariの「ダブルタップで画面ごと拡大」を止める（ボタンのすき間やボードのまわりも含めて） */
html,body,header,aside{touch-action:manipulation}
body{height:100%;margin:0;background:var(--chrome);color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overflow:hidden}
#app{height:100%;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto 1fr}
header{grid-column:1/3;display:flex;align-items:center;gap:5px;padding:4px 8px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.grp{display:flex;align-items:center;gap:4px}
#pauseBtn{border:2px solid var(--ink);font-weight:700}
#pauseBtn.resume{background:#1f8a4c;color:#fff;border-color:#1f8a4c}
#pauseBtn.resume svg{fill:currentColor}
/* 全画面時は左上にSafariの✕ボタンが重なるので、その分あける */
html.fs header{padding-left:76px}
.sep{flex:1}
button{font:inherit;color:var(--ink);background:var(--btn);border:1px solid var(--line);border-radius:10px;
  min-width:42px;height:42px;padding:0 8px;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  touch-action:manipulation;cursor:pointer}
button:disabled{opacity:.35}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#pageLabel{min-width:64px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
#recBtn{background:var(--rec);color:#fff;border-color:transparent;font-weight:700;padding:0 16px}
#recBtn .dot{width:12px;height:12px;border-radius:50%;background:#fff}
#recBtn.live .dot{border-radius:2px}
select{font:inherit;color:var(--ink);background:var(--btn);border:1px solid var(--line);border-radius:10px;height:44px;padding:0 10px}
select:disabled{opacity:.4}
.iconSel{position:relative;display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border:1px solid var(--line);border-radius:10px;background:var(--btn);color:var(--ink)}
.iconSel svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.iconSel select{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:16px}
button.danger{background:var(--rec);color:#fff;border-color:transparent;font-weight:700}
#rewindBtn{color:var(--rec);border-color:var(--rec);font-weight:700}
#rewindBtn svg{fill:currentColor}
#rewindBtn:disabled{opacity:.35}
#recTime{font-variant-numeric:tabular-nums;font-weight:700;min-width:52px;color:var(--rec)}
aside{display:flex;flex-direction:column;gap:6px;padding:10px 8px;border-right:1px solid var(--line);overflow-y:auto}
aside .tool{flex-direction:column;height:58px;width:60px;gap:2px;font-size:11px;padding:0}
aside .tool[aria-pressed="true"],button.toggle[aria-pressed="true"]{background:var(--on);color:var(--onInk);border-color:var(--on)}
aside hr{border:0;border-top:1px solid var(--line);margin:4px 2px;width:auto}
.cap{width:60px;height:36px;border-radius:8px;padding:0;position:relative}
.cap span{display:block;width:34px;height:14px;border-radius:7px;background:var(--c)}
.cap[aria-pressed="true"]{border:2px solid var(--ink)}
.size{width:60px;height:36px;padding:0}
.size{gap:6px;justify-content:flex-start;padding-left:12px}
.size i{display:block;border-radius:50%;background:currentColor;flex:none}
.size b{font-size:12px;font-weight:500}
.emode{justify-content:center;padding-left:0}
.size[aria-pressed="true"]{border:2px solid var(--ink)}
main{position:relative;background:var(--wall);display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none;padding:3px}
#board{display:block;background:#fff;border-radius:6px;box-shadow:0 0 0 2px var(--frame),0 3px 10px rgba(0,0,0,.15);touch-action:none}
#zoomBtn{position:absolute;right:16px;bottom:16px;height:52px;padding:0 18px;font-size:16px;border-radius:14px;background:var(--on);color:var(--onInk);border-color:var(--on);font-weight:700;box-shadow:0 4px 12px rgba(0,0,0,.25)}
#countdown{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:120px;font-weight:700;color:#fff;
  background:rgba(20,28,36,.45);pointer-events:none}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--chrome);
  padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1}
dialog{border:none;border-radius:16px;padding:18px;background:var(--chrome);color:var(--ink);max-width:min(92vw,820px);width:100%}
#libDlg,#pdfDlg{max-width:min(94vw,860px)}
.pdfBar{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.pdfBar input{flex:1;min-width:160px;font:inherit;font-size:16px;color:var(--ink);background:var(--btn);border:1px solid var(--line);border-radius:10px;height:42px;padding:0 12px;-webkit-user-select:text;user-select:text}
.pdfGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;max-height:58vh;overflow-y:auto;padding:2px}
.pdfTile{position:relative;height:auto;min-height:0;padding:4px;flex-direction:column;border-radius:8px;border:2px solid var(--line)}
.pdfTile img{display:block;width:100%;aspect-ratio:1/1.414;object-fit:contain;background:#fff;border-radius:4px}
.pdfTile span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.pdfTile.on{border-color:var(--rec);background:color-mix(in srgb,var(--rec) 10%,var(--btn))}
.pdfTile.on::after{content:"✓";position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:var(--rec);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
.libSave{display:flex;gap:8px;margin-bottom:12px}
.libSave input{flex:1;min-width:0;font:inherit;font-size:16px;color:var(--ink);background:var(--btn);border:1px solid var(--line);border-radius:10px;height:44px;padding:0 12px;-webkit-user-select:text;user-select:text}
.libList{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;max-height:55vh;overflow-y:auto;padding:2px}
.libItem{border:1px solid var(--line);border-radius:12px;padding:8px;background:var(--btn);display:flex;flex-direction:column;gap:6px}
.libItem.cur{border:2px solid var(--ink)}
.libItem img{width:100%;aspect-ratio:4/3;object-fit:contain;background:#fff;border-radius:6px;border:1px solid var(--line)}
.libItem .nm{font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.libItem .meta{font-size:12px;color:var(--muted)}
.libItem .act{display:flex;gap:6px}
.libItem .act button{flex:1;height:38px;font-size:13px}
.libEmpty{color:var(--muted);font-size:14px;padding:20px 4px;grid-column:1/-1}
dialog::backdrop{background:rgba(10,14,18,.55)}
dialog video{width:100%;border-radius:8px;background:#000;display:block}
dialog h2{font-size:18px;margin:0 0 12px}
dialog .row{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
#confirmDlg{max-width:min(92vw,460px)}
dialog .dangerBtn{background:var(--rec);color:#fff;border-color:var(--rec);font-weight:700;min-width:96px}
dialog .primary{background:var(--on);color:var(--onInk);border-color:var(--on);font-weight:700}
dialog p{font-size:14px;color:var(--muted);margin:10px 0 0;line-height:1.7}
.hide{display:none!important}
@media (prefers-reduced-motion: reduce){#toast{transition:none}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="grp">
      <button id="prevBtn" aria-label="前のページ"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <span id="pageLabel">1 / 1</span>
      <button id="nextBtn" aria-label="次のページ"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
      <button id="addBtn" aria-label="ページを追加" title="ページを追加"><svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8z"/><path d="M14 3v5h5"/><path d="M12 11v6M9 14h6"/></svg></button>
      <button id="delPageBtn" aria-label="このページを削除" title="このページを削除"><svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8z"/><path d="M14 3v5h5"/><path d="M9.5 12.5l5 5M14.5 12.5l-5 5"/></svg></button>
    </div>
    <div class="grp">
      <button id="undoBtn" aria-label="元に戻す"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg></button>
      <button id="redoBtn" aria-label="やり直す"><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 000 12h3"/></svg></button>
      <button id="clearBtn" aria-label="手書きを全消し" title="手書きを全消し（PDF・画像は残す）"><svg viewBox="0 0 24 24"><path d="M3 15c2-4 4-4 5 0s3 4 5 0"/><path d="M15 4l6 6M21 4l-6 6"/></svg></button>
    </div>
    <div class="grp">
      <button id="gridBtn" class="toggle" aria-pressed="false" aria-label="方眼" title="方眼"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="1.5"/><path d="M9.3 4v16M14.7 4v16M4 9.3h16M4 14.7h16"/></svg></button>
      <button id="darkBtn" class="toggle" aria-pressed="false" aria-label="黒板" title="黒板"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="12" rx="1.5" style="fill:currentColor;fill-opacity:.85"/><path d="M8 21l2-4M16 21l-2-4"/></svg></button>
      <button id="importBtn" aria-label="PDF・画像を読み込む" title="PDF・画像を読み込む"><svg viewBox="0 0 24 24"><path d="M12 3v11M7.5 9.5L12 14l4.5-4.5"/><path d="M4 15v3a2 2 0 002 2h12a2 2 0 002-2v-3"/></svg></button>
      <button id="libBtn" aria-label="ライブラリ" title="ライブラリ（ボードの保存・呼び出し）"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="4" height="16" rx="1"/><rect x="10" y="4" width="4" height="16" rx="1"/><path d="M16.5 5.2l3.6-1 3 15.4-3.6 1z" transform="translate(-2.2 .4)"/></svg></button>
      <input id="file" type="file" accept="image/*,application/pdf" multiple class="hide">
    </div>
    <div class="sep"></div>
    <div class="grp">
      <label class="iconSel" id="gainWrap" title="録音の音量"><span id="gainIcon"></span>
        <select id="gainSel" aria-label="録音の音量">
          <option value="1">音量：標準</option>
          <option value="2.5" selected>音量：大</option>
          <option value="4">音量：特大</option>
        </select></label>
      <label class="iconSel" id="qualityWrap" title="画質"><span id="qualityIcon"></span>
        <select id="quality" aria-label="画質">
          <option value="light">画質：軽量（5分≒12MB）</option>
          <option value="std" selected>画質：標準（5分≒25MB）</option>
          <option value="high">画質：高画質（5分≒60MB）</option>
        </select></label>
      <span id="recTime" class="hide">00:00</span>
      <button id="rewindBtn" class="hide" title="一時停止したところまで動画を戻して撮り直す"><svg viewBox="0 0 24 24"><path d="M6 5v14"/><path d="M18 5l-9 7 9 7z"/></svg>撮り直し</button>
      <button id="checkBtn" class="hide" title="ここまで録画した内容を再生して確かめる（録画は一時停止します）"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 9.5l5 2.5-5 2.5z" style="fill:currentColor"/></svg>確認</button>
      <button id="pauseBtn" class="hide" aria-label="一時停止" title="一時停止"><svg viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></svg></button>
      <button id="recBtn"><span class="dot"></span><span id="recLabel">録画</span></button>
      <button id="fsBtn" aria-label="全画面"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    </div>
  </header>

  <aside aria-label="道具">
    <button class="tool" data-tool="pen" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M4 20l4-1L19 8l-3-3L5 16z"/><path d="M14 7l3 3"/></svg>ペン</button>
    <button class="tool" data-tool="hl" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M6 20h12"/><path d="M8 16l2-2 7-7-3-3-7 7-1 3z"/></svg>マーカー</button>
    <button class="tool" data-tool="eraser" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M8 20h12"/><path d="M4 15l9-9 6 6-8 8H8z"/></svg>消しゴム</button>
    <button class="tool" data-tool="laser" aria-pressed="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/></svg>レーザー</button>
    <button class="tool" data-tool="move" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M5 5h3M11 5h3M17 5h2v2M19 10v3M19 16v3h-2M14 19h-3M8 19H5v-2M5 14v-3M5 8V5" /></svg>選択</button>
    <div id="eraseGroup" style="display:none;flex-direction:column;gap:6px">
      <hr>
      <button class="size emode" data-emode="part" aria-pressed="true"><b>部分</b></button>
      <button class="size emode" data-emode="stroke" aria-pressed="false"><b>線ごと</b></button>
    </div>
    <div id="inkGroup" style="display:contents">
    <div id="colorGroup" style="display:contents">
    <hr>
    <button class="cap" data-color="#1a1a1a" aria-label="黒" aria-pressed="true" style="--c:#1a1a1a"><span></span></button>
    <button class="cap" data-color="#d62828" aria-label="赤" aria-pressed="false" style="--c:#d62828"><span></span></button>
    <button class="cap" data-color="#1f5fbf" aria-label="青" aria-pressed="false" style="--c:#1f5fbf"><span></span></button>
    <button class="cap hlOnly hide" data-color="#ffd400" aria-label="黄" aria-pressed="false" style="--c:#ffd400"><span></span></button>
    </div>
    <hr>
    <button class="size" data-size="2.5" aria-label="細" aria-pressed="false"><i style="width:4px;height:4px"></i><b>細</b></button>
    <button class="size" data-size="4.5" aria-label="中" aria-pressed="true"><i style="width:8px;height:8px"></i><b>中</b></button>
    <button class="size" data-size="8" aria-label="太" aria-pressed="false"><i style="width:13px;height:13px"></i><b>太</b></button>
    </div>
    <hr>
    <div id="selGroup" style="display:none;flex-direction:column;gap:6px">
      <button class="tool" id="copyBtn"><svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 00-1-1H5a1 1 0 00-1 1v10a1 1 0 001 1h3"/></svg>コピー</button>
      <button class="tool" id="cutBtn"><svg viewBox="0 0 24 24"><circle cx="6" cy="18" r="3"/><circle cx="18" cy="18" r="3"/><path d="M8 16L19 4M16 16L5 4"/></svg>切り取り</button>
      <button class="tool" id="pasteBtn"><svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="16" rx="2"/><path d="M9 5V3h6v2M9 11h6M9 15h4"/></svg>貼り付け</button>
      <button class="tool" id="delSelBtn"><svg viewBox="0 0 24 24"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12"/></svg>削除</button>
    </div>
  </aside>

  <main id="stage">
    <canvas id="board"></canvas>
    <div id="countdown"></div>
    <button id="zoomBtn" class="hide" aria-label="全体表示に戻す"></button>
  </main>
</div>

<div id="toast" role="status"></div>

<dialog id="confirmDlg">
  <h2 id="confirmTitle"></h2>
  <p id="confirmText" style="color:var(--ink)"></p>
  <div class="row">
    <button id="confirmCancel">キャンセル</button>
    <button id="confirmOk" class="dangerBtn"></button>
  </div>
</dialog>

<dialog id="pdfDlg">
  <h2 id="pdfTitle">PDF</h2>
  <div class="pdfBar">
    <input id="pdfRange" type="text" inputmode="numeric" placeholder="ページ指定（例：3-8, 12）" autocomplete="off">
    <button id="pdfRangeBtn">選ぶ</button>
    <button id="pdfAll">全部</button>
    <button id="pdfNone">解除</button>
  </div>
  <div id="pdfGrid" class="pdfGrid"></div>
  <div class="row">
    <button id="pdfCancel">キャンセル</button>
    <button id="pdfOk" class="primary">取り込む</button>
  </div>
</dialog>

<dialog id="libDlg">
  <h2>ライブラリ</h2>
  <div class="libSave">
    <input id="libName" type="text" placeholder="名前（例：例題11 正負の数）" autocomplete="off">
    <button id="libSaveBtn" class="primary">今のボードを保存</button>
  </div>
  <div id="libList" class="libList"></div>
  <div class="row">
    <button id="diagBtn" title="直近に書いた線の、ペンから届いた生の点を保存します（不具合の調査用）">書き心地の記録を保存</button>
    <button id="libNewBtn">新しいボード</button>
    <button id="libClose">閉じる</button>
  </div>
</dialog>

<dialog id="recoverDlg">
  <h2>録画の復元</h2>
  <p id="recoverText" style="color:var(--ink)"></p>
  <div class="row">
    <button id="recoverDiscard">破棄する</button>
    <button id="recoverOk" class="primary">動画にする</button>
  </div>
</dialog>

<dialog id="checkDlg">
  <h2>ここまでの録画</h2>
  <video id="checkVideo" controls playsinline></video>
  <p>録画は一時停止しています。閉じたあと「再開」で続きを撮るか、「撮り直し」で直前の場面を撮り直せます。</p>
  <div class="row">
    <button id="checkLast10">直前10秒</button>
    <button id="checkFromStart">最初から</button>
    <button id="checkClose" class="primary">閉じる</button>
  </div>
</dialog>

<dialog id="resultDlg">
  <h2>録画した動画</h2>
  <video id="resultVideo" controls playsinline></video>
  <p id="saveNote" class="hide"></p>
  <div class="row">
    <button id="discardBtn">破棄して閉じる</button>
    <button id="saveBtn" class="primary">動画を保存</button>
  </div>
</dialog>

<script type="module">
// PDFの表示部品（pdf.js 4系・古めのiPadでも動く legacy 版）。3系では日本語フォントが崩れるPDFがあったため更新
import * as lib from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/legacy/build/pdf.min.mjs';
lib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/legacy/build/pdf.worker.min.mjs';
window.pdfjsLib = lib;
</script>
<script>
(() => {
const W = 1920, H = 1080;
let VW = 1440, X0 = 240, dark = false;   // 既定はiPadの画面に近い4:3
const cv = document.getElementById('board');
cv.width = W; cv.height = H;
const ctx = cv.getContext('2d');
const stage = document.getElementById('stage');
const $ = id => document.getElementById(id);

/* ---------- state ---------- */

  let t = L ? ((px - a.x)*dx + (py - a.y)*dy) / L : 0; t = Math.max(0, Math.min(1, t));
  const x = a.x + t*dx, y = a.y + t*dy; return Math.hypot(px - x, py - y);
}
function resample(p, step){
  if (p.length < 2) return p;
  const o = [p[0]];
  for (let i = 1; i < p.length; i++){
    const a = p[i-1], b = p[i], d = Math.hypot(b.x - a.x, b.y - a.y), n = Math.floor(d / step);
    for (let k = 1; k <= n; k++){ const t = k * step / d; if (t < 1) o.push({ x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t, p: a.p + (b.p - a.p) * t }); }
    o.push(b);

}
function eraseAt(pt){

    const r = R0 + it.size / 2, p = it.pts;
    const near = p.length === 1 ? Math.hypot(p[0].x - pt.x, p[0].y - pt.y) < r : p.some((q, k) => k && segDist(pt.x, pt.y, p[k-1], q) < r);

    hit = true;

    const q = resample(p, Math.max(1.5, R0 / 4));

function bbox(items){

    else { const r = it.size; for (const p of it.pts){ x0 = Math.min(x0, p.x - r); y0 = Math.min(y0, p.y - r); x1 = Math.max(x1, p.x + r); y1 = Math.max(y1, p.y + r); } }

}

function pip(pt, poly){

    if (it.type === 'image') return it.x < r.x + r.w && it.x + it.w > r.x && it.y < r.y + r.h && it.y + it.h > r.y;
    let k = 0; for (const p of it.pts) if (inR(p)) k++;

function hitAt(pt){

  for (let i = items.length - 1; i >= 0; i--){

    if (it.locked){ if (pt.x >= it.x && pt.x <= it.x + it.w && pt.y >= it.y && pt.y <= it.y + it.h) lockedHit = lockedHit || it; continue; }
    if (it.type === 'image'){ if (pt.x >= it.x && pt.x <= it.x + it.w && pt.y >= it.y && pt.y <= it.y + it.h) return it; }
    else {
      const r = Math.max(14, it.size), p = it.pts;
      if (p.length === 1 ? Math.hypot(p[0].x - pt.x, p[0].y - pt.y) < r : p.some((q, k) => k && segDist(pt.x, pt.y, p[k-1], q) < r)) return it;

function tfItem(it, a, dx, dy, s){

const touches = new Map(); let pinch = null;

cv.addEventListener('pointermove', e => {
  if (e.pointerType === 'touch' && touches.has(e.pointerId)){
    touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pinch && touches.size >= 2){

function endPointer(e){

$('diagBtn').onclick = async () => {

  const info = { ua: navigator.userAgent, dpr: devicePixelRatio, board: [cv.width, cv.height], css: [cv.clientWidth, cv.clientHeight], zoom: Z, at: new Date().toISOString(), strokes: diag };
  const d = new Date(), z = n => String(n).padStart(2, '0');
  const r = await saveOne(new Blob([JSON.stringify(info)], { type: 'application/json' }), `kakigokochi_${d.getMonth() + 1}${z(d.getDate())}_${z(d.getHours())}${z(d.getMinutes())}.json`);

function syncColors(){
  const hl = tool === 'hl', c = hl ? hlColor : penColor;

  document.querySelectorAll('.hlOnly').forEach(x => x.classList.toggle('hide', !hl));

  $('inkGroup').style.display = (tool === 'pen' || tool === 'hl' || er || lz) ? 'contents' : 'none';

// 長方形で囲んだ範囲から、はみ出した画像・PDFの部分だけを1枚の画像に切り出す
function cropOf(r, imgs){
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const it of imgs){ x0 = Math.min(x0, it.x); y0 = Math.min(y0, it.y); x1 = Math.max(x1, it.x + it.w); y1 = Math.max(y1, it.y + it.h); }

  if (q.w <= 1 || q.h <= 1) return null;

  for (const it of imgs){ const im = getImg(it.src); if (im.naturalWidth) f = Math.max(f, im.naturalWidth / it.w); }
  f = Math.min(3, f);
  const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(q.w * f)); c.height = Math.max(1, Math.round(q.h * f));
  const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
  g.setTransform(f, 0, 0, f, -q.x * f, -q.y * f);

// コピー：長方形で囲んだときは「囲んだ範囲に見えているもの」をコピーする

// タップで選んだときは、選んだものを丸ごとコピーする

    const whole = imgs.filter(it => !it.locked && inside(it)), part = imgs.filter(it => !whole.includes(it));

    const crop = part.length ? cropOf(r, part) : null; if (crop) out.push(crop);

$('importBtn').onclick = () => $('file').click();

function fitRect(w, h, maxW, maxH){ const s = Math.min(maxW / w, maxH / h); return { w: w * s, h: h * s }; }
async function importImage(f){
  const url = URL.createObjectURL(f);
  const im = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
  const s = Math.min(1, 3000 / Math.max(im.naturalWidth, im.naturalHeight));   // 拡大しても粗くならないよう、長い辺3000ドットまで残す
  const c = document.createElement('canvas'); c.width = Math.round(im.naturalWidth * s); c.height = Math.round(im.naturalHeight * s);
  const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(im, 0, 0, c.width, c.height);
  URL.revokeObjectURL(url);
  const src = c.toDataURL('image/jpeg', 0.88);
  const r = fitRect(c.width, c.height, VW * 0.6, H * 0.7);
  snapshot();
  const item = { type: 'image', src, x: (W - r.w) / 2, y: (H - r.h) / 2, w: r.w, h: r.h, locked: false };
  page().items.push(item);
  document.querySelector('[data-tool="move"]').click(); sel = [item]; changed();
  toast('画像を貼りました。ドラッグで移動、右下の四角で拡大縮小できます');
}
async function importPdf(f){
  if (!window.pdfjsLib){ toast('PDFの読み込み機能を準備できませんでした'); return; }
  const data = new Uint8Array(await f.arrayBuffer());
  const PDFJS = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/';
  const pdf = await pdfjsLib.getDocument({
    data,
    cMapUrl: PDFJS + 'cmaps/', cMapPacked: true,            // 日本語などのフォント表
    standardFontDataUrl: PDFJS + 'standard_fonts/',
    useSystemFonts: true,
  }).promise;
  const nums = pdf.numPages === 1 ? [1] : await pickPdfPages(pdf, f.name);
  if (!nums || !nums.length){ pdf.destroy(); return; }
  const insertAt = page().items.length ? cur + 1 : cur;
  const newPages = [];
  for (let k = 0; k < nums.length; k++){
    toast(`PDFを読み込み中 ${k + 1} / ${nums.length}`, 60000);
    const pg = await pdf.getPage(nums[k]);
    const v1 = pg.getViewport({ scale: 1 });
    // ボードに収まる大きさの3倍の細かさで画像にする（拡大しても文字がくっきり残るように）。
    // ただし長い辺は3600ドットまで（iPadのメモリとキャンバスの上限に収める）
    const fitScale = Math.min(VW / v1.width, H / v1.height);
    const scale = Math.min(fitScale * 3, 3600 / Math.max(v1.width, v1.height));
    const vp = pg.getViewport({ scale });
    const c = document.createElement('canvas'); c.width = Math.round(vp.width); c.height = Math.round(vp.height);
    const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
    await pg.render({ canvasContext: g, viewport: vp }).promise;
    const src = c.toDataURL('image/jpeg', 0.92);
    c.width = c.height = 0; pg.cleanup();
    const r = fitRect(vp.width, vp.height, VW, H);
    const p = newPage(); p.items.push({ type: 'image', src, x: (W - r.w) / 2, y: (H - r.h) / 2, w: r.w, h: r.h, locked: true });
    newPages.push(p);
  }
  pdf.destroy();
  if (!page().items.length) pages.splice(cur, 1, ...newPages); else pages.splice(insertAt, 0, ...newPages);
  goTo(insertAt);
  toast(`PDF ${nums.length}ページを追加しました`);
}
// サムネイルを見ながら取り込むページを選ぶ（見えている分だけ小さく描くので、ページ数が多くても軽い）
function pickPdfPages(pdf, name){
  return new Promise(resolve => {
    const N = pdf.numPages, chosen = new Set(N <= 10 ? Array.from({ length: N }, (_, i) => i + 1) : []);
    const dlg = $('pdfDlg'), grid = $('pdfGrid');
    $('pdfTitle').textContent = `${name}（全${N}ページ）`;
    grid.innerHTML = ''; $('pdfRange').value = '';
    const tiles = [];
    const sync = () => {
      tiles.forEach((t, i) => t.classList.toggle('on', chosen.has(i + 1)));
      $('pdfOk').textContent = chosen.size ? `${chosen.size}ページを取り込む` : 'ページを選んでください';
      $('pdfOk').disabled = !chosen.size;
    };
    // 描画は1枚ずつ順番に
    let queue = [], busy = false, closed = false;
    const pump = async () => {
      if (busy || closed) return; busy = true;
      while (queue.length && !closed){
        const n = queue.shift(), t = tiles[n - 1]; if (t.dataset.done) continue;
        try {
          const pg = await pdf.getPage(n), v1 = pg.getViewport({ scale: 1 }), vp = pg.getViewport({ scale: 220 / v1.width });
          const c = document.createElement('canvas'); c.width = Math.round(vp.width); c.height = Math.round(vp.height);
          const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
          await pg.render({ canvasContext: g, viewport: vp }).promise;
          t.querySelector('img').src = c.toDataURL('image/jpeg', 0.7); t.dataset.done = '1'; pg.cleanup();
        } catch (e){}
      }
      busy = false;
    };
    const io = new IntersectionObserver(es => {
      for (const e of es) if (e.isIntersecting){ const n = +e.target.dataset.n; if (!e.target.dataset.done && !queue.includes(n)) queue.push(n); }
      pump();
    }, { root: grid, rootMargin: '300px' });
    for (let n = 1; n <= N; n++){
      const t = document.createElement('button'); t.type = 'button'; t.className = 'pdfTile'; t.dataset.n = n;
      t.innerHTML = `<img alt=""><span>${n}</span>`;
      t.onclick = () => { chosen.has(n) ? chosen.delete(n) : chosen.add(n); sync(); };
      grid.appendChild(t); tiles.push(t); io.observe(t);
    }
    const finish = v => { closed = true; io.disconnect(); dlg.close(); resolve(v); };
    $('pdfAll').onclick = () => { for (let n = 1; n <= N; n++) chosen.add(n); sync(); };
    $('pdfNone').onclick = () => { chosen.clear(); sync(); };
    $('pdfRangeBtn').onclick = () => {
      // 「3-8, 12」のような指定
      const txt = $('pdfRange').value.replace(/[０-９]/g, d => String.fromCharCode(d.charCodeAt(0) - 0xFEE0)).replace(/[〜～ー－−]/g, '-').replace(/[、，]/g, ',');
      let any = false;
      for (const part of txt.split(',')){
        const m = part.trim().match(/^(\d+)\s*(?:-\s*(\d+))?$/); if (!m) continue;
        let a = +m[1], b = m[2] ? +m[2] : a; if (a > b) [a, b] = [b, a];
        for (let n = Math.max(1, a); n <= Math.min(N, b); n++){ chosen.add(n); any = true; }
      }
      if (any){ sync(); const first = Math.min(...chosen); tiles[first - 1].scrollIntoView({ block: 'center' }); }
      else toast('「3-8, 12」のように入力してください');
    };
    $('pdfRange').onkeydown = e => { if (e.key === 'Enter'){ e.preventDefault(); $('pdfRangeBtn').click(); } };
    $('pdfCancel').onclick = () => finish(null);
    $('pdfOk').onclick = () => finish([...chosen].sort((a, b) => a - b));
    dlg.oncancel = e => { e.preventDefault(); finish(null); };
    sync(); dlg.showModal();
  });
}

/* ---------- 場面（断片化MP4）をつなげて1本にする ---------- */
const MP4 = (() => {
  const s4 = (dv, o) => String.fromCharCode(dv.getUint8(o), dv.getUint8(o+1), dv.getUint8(o+2), dv.getUint8(o+3));
  async function topBoxes(blob){
    const out = []; let off = 0;
    while (off + 8 <= blob.size){
      const dv = new DataView(await blob.slice(off, Math.min(blob.size, off + 16)).arrayBuffer());
      let size = dv.getUint32(0), hdr = 8; const type = s4(dv, 4);
      if (size === 1){ if (dv.byteLength < 16) break; size = Number(dv.getBigUint64(8)); hdr = 16; }
      else if (size === 0) size = blob.size - off;
      if (size < hdr || off + size > blob.size) break;           // 途中で切れた箱は捨てる
      out.push({ type, off, size, hdr }); off += size;
    }
    return out;
  }
  function kids(dv, start, end){
    const out = []; let o = start;
    while (o + 8 <= end){
      let size = dv.getUint32(o), hdr = 8; const type = s4(dv, o + 4);
      if (size === 1){ size = Number(dv.getBigUint64(o + 8)); hdr = 16; } else if (size === 0) size = end - o;
      if (size < hdr || o + size > end) break;
      out.push({ type, off: o, size, hdr, end: o + size }); o += size;
    }
    return out;
  }
  const find = (dv, box, type) => kids(dv, box.off + box.hdr, box.end).filter(b => b.type === type);
  function parseMoov(bytes){
    const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
    const moov = { type: 'moov', off: 0, hdr: 8, end: bytes.byteLength };
    const tracks = {}; let movieTs = 1000, mehd = null;
    for (const b of kids(dv, 8, bytes.byteLength)){
      if (b.type === 'mvhd'){ const v = dv.getUint8(b.off + 8); movieTs = dv.getUint32(b.off + (v ? 28 : 20)); }
      if (b.type === 'trak'){
        const tkhd = find(dv, b, 'tkhd')[0], mdia = find(dv, b, 'mdia')[0];
        const tv = dv.getUint8(tkhd.off + 8); const id = dv.getUint32(tkhd.off + (tv ? 28 : 20));
        const mdhd = find(dv, mdia, 'mdhd')[0]; const mv = dv.getUint8(mdhd.off + 8);
        tracks[id] = { ts: dv.getUint32(mdhd.off + (mv ? 28 : 20)), defDur: 0 };

    }
    for (const mvex of find(dv, moov, 'mvex')){
      for (const t of find(dv, mvex, 'trex')){ const id = dv.getUint32(t.off + 12); if (tracks[id]) tracks[id].defDur = dv.getUint32(t.off + 20); }

    }
    return { tracks, movieTs, mehd };
  }
  function parseMoof(bytes, init){
    const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
    const root = { off: 0, hdr: 8, end: bytes.byteLength };
    const trafs = [];
    for (const traf of find(dv, root, 'traf')){
      const tfhd = find(dv, traf, 'tfhd')[0]; if (!tfhd) continue;
      const fl = dv.getUint32(tfhd.off + 8) & 0xffffff, id = dv.getUint32(tfhd.off + 12);

      if (fl & 0x01){ bdo = p; p += 8; } if (fl & 0x02) p += 4; if (fl & 0x08){ defDur = dv.getUint32(p); p += 4; }
      const tfdt = find(dv, traf, 'tfdt')[0]; let tOff = null, tVer = 0, t = 0;
      if (tfdt){ tVer = dv.getUint8(tfdt.off + 8); tOff = tfdt.off + 12; t = tVer ? Number(dv.getBigUint64(tOff)) : dv.getUint32(tOff); }
      let dur = 0;
      for (const trun of find(dv, traf, 'trun')){
        const rf = dv.getUint32(trun.off + 8) & 0xffffff, n = dv.getUint32(trun.off + 12);
        let q = trun.off + 16; if (rf & 0x01) q += 4; if (rf & 0x04) q += 4;
        for (let i = 0; i < n; i++){
          if (rf & 0x100){ dur += dv.getUint32(q); q += 4; } else dur += defDur;
          if (rf & 0x200) q += 4; if (rf & 0x400) q += 4; if (rf & 0x800) q += 4;
        }
      }
      trafs.push({ id, bdo, tOff, tVer, t, dur });
    }

    return { dv, trafs, seqOff: mfhd ? mfhd.off + 12 : null };
  }
  async function join(blobs, type){
    if (blobs.length === 1) return blobs[0];
    const segs = [];

      const boxes = await topBoxes(blob);

      if (!moovBox || !ftyp) throw new Error('not fmp4');

      const init = parseMoov(moov);

        const md = boxes[i + 1]; if (!md || md.type !== 'mdat') continue;   // 欠けた断片は捨てる

    }

    for (const s of segs){
      for (const f of s.frags){
        const dv = f.info.dv;
        if (f.info.seqOff !== null) dv.setUint32(f.info.seqOff, seq++);
        for (const tr of f.info.trafs){
          const ts = base.init.tracks[tr.id].ts, r = s.range[tr.id];

const MP4F = (() => {
  const s4 = (dv, o) => String.fromCharCode(dv.getUint8(o), dv.getUint8(o+1), dv.getUint8(o+2), dv.getUint8(o+3));
  const CONTAINERS = new Set(['moov', 'trak', 'mdia', 'minf', 'stbl', 'mvex', 'moof', 'traf', 'edts', 'dinf', 'udta']);
  async function topBoxes(blob){
    const out = []; let off = 0;
    while (off + 8 <= blob.size){
      const dv = new DataView(await blob.slice(off, Math.min(blob.size, off + 16)).arrayBuffer());
      let size = dv.getUint32(0), hdr = 8; const type = s4(dv, 4);
      if (size === 1){ if (dv.byteLength < 16) break; size = Number(dv.getBigUint64(8)); hdr = 16; }
      else if (size === 0) size = blob.size - off;
      if (size < hdr || off + size > blob.size) break;
      out.push({ type, off, size, hdr }); off += size;

    return out;
  }
  // バイト列を箱の木に分解する
  function parse(u8, start = 0, end = u8.byteLength){
    const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
    const out = []; let o = start;
    while (o + 8 <= end){
      let size = dv.getUint32(o), hdr = 8; const type = s4(dv, o + 4);
      if (size === 1){ size = Number(dv.getBigUint64(o + 8)); hdr = 16; } else if (size === 0) size = end - o;
      if (size < hdr || o + size > end) break;

      if (CONTAINERS.has(type)) b.kids = parse(u8, o + hdr, o + size);
      out.push(b); o += size;
    }
    return out;
  }
  const kid = (b, t) => b.kids && b.kids.find(k => k.type === t);
  const kidsOf = (b, t) => (b.kids || []).filter(k => k.type === t);
  const dvOf = b => new DataView(b.raw.buffer, b.raw.byteOffset, b.raw.byteLength);

  const cat = arrs => { const n = arrs.reduce((a, x) => a + x.byteLength, 0), o = new Uint8Array(n); let p = 0; for (const x of arrs){ o.set(x, p); p += x.byteLength; } return o; };

    const boxes = await topBoxes(blob);

            if (rf & 0x200){ s.size = d.getUint32(q); q += 4; }
            if (rf & 0x400){ s.flags = d.getUint32(q); q += 4; }

        }

    return { blob, init, runs };

  function stbl(stsdRaw, t, offsets, co64){
    const parts = [stsdRaw];
    // stts
    const stts = []; for (const s of t.samples){ const L = stts[stts.length - 1]; if (L && L[1] === s.dur) L[0]++; else stts.push([1, s.dur]); }
    parts.push(full('stts', 0, 0, u32(stts.length), ...stts.flatMap(([c, d]) => [u32(c), u32(d)])));
    // ctts
    if (t.samples.some(s => s.cto)){
      const neg = t.samples.some(s => s.cto < 0), e = [];
      for (const s of t.samples){ const L = e[e.length - 1]; if (L && L[1] === s.cto) L[0]++; else e.push([1, s.cto]); }
      parts.push(full('ctts', neg ? 1 : 0, 0, u32(e.length), ...e.flatMap(([c, o]) => [u32(c), neg ? i32(o) : u32(o)])));
    }
    // stss（映像のキーフレーム）
    if (t.handler === 'vide'){
      const sync = []; t.samples.forEach((s, i) => { if (!(s.flags & 0x10000)) sync.push(i + 1); });
      if (sync.length && sync.length < t.samples.length) parts.push(full('stss', 0, 0, u32(sync.length), ...sync.map(u32)));
    }
    // stsc
    const stsc = []; t.chunks.forEach((n, i) => { const L = stsc[stsc.length - 1]; if (!L || L[1] !== n) stsc.push([i + 1, n]); });
    parts.push(full('stsc', 0, 0, u32(stsc.length), ...stsc.flatMap(([f, n]) => [u32(f), u32(n), u32(1)])));
    parts.push(full('stsz', 0, 0, u32(0), u32(t.samples.length), ...t.samples.map(s => u32(s.size))));

    const parts = [];

    for (const id in T) movieDur = Math.max(movieDur, Math.round(T[id].total / T[id].ts * init.movieTs));
    for (const b of init.moov.kids){
      if (b.type === 'mvhd') parts.push(patchDur(b.raw, 24, 32, movieDur));
      else if (b.type === 'trak'){
        const tr = Object.values(init.tracks).find(x => x.trak === b); const t = tr && T[tr.id];
        if (!t || !t.samples.length) continue;

          if (c.type === 'tkhd') tp.push(patchDur(c.raw, 28, 36, Math.round(t.total / t.ts * init.movieTs)));
          else if (c.type === 'edts') continue;
          else if (c.type === 'mdia'){
            const mp = [];
            for (const m of c.kids){
              if (m.type === 'mdhd') mp.push(patchDur(m.raw, 24, 32, t.total));

    for (const id in init.tracks) T[id] = { ...init.tracks[id], samples: [], chunks: [], total: 0 };
    const pieces = [];      // 出力するデータの並び（元の場面ファイルの切り出し）

let audioCtx = null, micNode = null;
// マイクの音を増幅し、割れないようにリミッターをかけてから録音に回す
function boostMic(stream, gainValue){
  try {
    if (!audioCtx) return stream.getAudioTracks();
    const src = audioCtx.createMediaStreamSource(stream);
    const g = audioCtx.createGain(); g.gain.value = gainValue;
    const lim = audioCtx.createDynamicsCompressor();
    lim.threshold.value = -12; lim.knee.value = 6; lim.ratio.value = 12; lim.attack.value = 0.003; lim.release.value = 0.25;
    const dest = audioCtx.createMediaStreamDestination();
    src.connect(g); g.connect(lim); lim.connect(dest);
    micNode = src;
    return dest.stream.getAudioTracks();
  } catch (e){ return stream.getAudioTracks(); }
}
function fmt(ms){ const s = Math.floor(ms / 1000); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }
function totalMs(){ return segs.reduce((a, s) => a + s.dur, 0) + (take ? performance.now() - take.t0 : 0); }

function setRecUI(){

function startTake(){
  const r = new MediaRecorder(recStream, recOpts);
  const t = { id: ++takeSeq, rec: r, chunks: [], n: 0, t0: performance.now(), startSnap: boardSnap() };
  r.ondataavailable = e => { if (e.data && e.data.size){ t.chunks.push(e.data); idbPutChunk(t.id, t.n++, e.data); } };
  r.start(1000);
  take = t; recState = 'live'; setRecUI(); saveMeta();
}
async function finishTake(keep){
  const t = take; if (!t) return; take = null;
  const dur = performance.now() - t.t0;
  await new Promise(res => { t.rec.onstop = () => setTimeout(res, 0); try { t.rec.stop(); } catch (e){ res(); } });
  if (keep && t.chunks.length) segs.push({ id: t.id, chunks: t.chunks, dur, startSnap: t.startSnap });
  else idbDeleteTake(t.id);
  if (!recMime && t.rec.mimeType) recMime = t.rec.mimeType;
  saveMeta();
}

};

    if (!ok) return;
    const s = segs.pop(); idbDeleteTake(s.id); restoreSnap(s.startSnap); saveMeta();
    setRecUI(); tick(); toast('ひとつ前の区切りまで戻りました。「再開」で続きから撮れます', 4000);
  }
};

// 確認：ここまでの場面をつないだ動画をその場で作って再生する（録画中に押したら、まず一時停止する）
let checkURL = null;
async function joinSegs(blobs){
  const type = (recMime || 'video/mp4').split(';')[0];
  try { return await MP4F.finalize(blobs, type); }
  catch (e1){ try { return await MP4.join(blobs, type); } catch (e2){ return blobs[blobs.length - 1]; } }
}
$('checkBtn').onclick = async () => {
  if (recState === 'live'){ recState = 'busy'; setRecUI(); await finishTake(true); recState = 'paused'; setRecUI(); tick(); }
  if (recState !== 'paused' || !segs.length){ toast('まだ確かめられる録画がありません'); return; }
  recState = 'busy'; setRecUI(); toast('確認用の動画を作っています…', 30000);
  const blob = await joinSegs(segs.map(s => new Blob(s.chunks, { type: recMime || 'video/mp4' })));
  recState = 'paused'; setRecUI(); $('toast').classList.remove('show');
  if (checkURL) URL.revokeObjectURL(checkURL);
  checkURL = URL.createObjectURL(blob);
  const v = $('checkVideo');
  v.onloadedmetadata = () => { if (isFinite(v.duration)) v.currentTime = Math.max(0, v.duration - 10); v.play().catch(() => {}); };
  v.src = checkURL;
  $('checkDlg').showModal();
};
$('checkLast10').onclick = () => { const v = $('checkVideo'); if (isFinite(v.duration)) v.currentTime = Math.max(0, v.duration - 10); v.play().catch(() => {}); };
$('checkFromStart').onclick = () => { const v = $('checkVideo'); v.currentTime = 0; v.play().catch(() => {}); };
function closeCheck(){

  $('checkDlg').close();
}
$('checkClose').onclick = closeCheck;
$('checkDlg').oncancel = e => { e.preventDefault(); closeCheck(); };

async function startRec(){
  if (!window.MediaRecorder || !cv.captureStream){ toast('このブラウザでは録画できません。iPadOSとSafariを最新にしてください', 4000); return; }
  recState = 'starting'; setRecUI();
  // 音の処理はボタンを押した直後に準備しないと、Safariで音が止まったままになる
  try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); audioCtx.resume(); } catch (e){ audioCtx = null; }
  micStream = null;
  let micMsg = '';
  let framed = false; try { framed = window.self !== window.top; } catch (e){ framed = true; }
  if (!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    micMsg = framed ? 'Claudeの画面内ではマイクを使えません' : 'https で始まるURLで開いていないため、マイクを使えません';
  } else {
    try {
      micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
    } catch (e){
      const n = e && e.name;
      micMsg = n === 'NotAllowedError' ? (framed ? 'Claudeの画面内ではマイクを使えません' : 'マイクが許可されていません。「ぁあ」→ Webサイトの設定 → マイク を確認してください')
        : n === 'NotFoundError' ? 'マイクが見つかりません'
        : n === 'NotReadableError' ? '別のアプリがマイクを使用中です'
        : `マイクを開始できませんでした（${n || '不明なエラー'}）`;
    }
  }
  if (micMsg) toast(micMsg + '。音声なしで録画します', 6000);
  const cd = $('countdown'); cd.style.display = 'flex';
  for (const n of [3, 2, 1]){ cd.textContent = n; await new Promise(r => setTimeout(r, 800)); }
  cd.style.display = 'none';
  const Q = QUALITY[$('quality').value] || QUALITY.std;
  recCanvas = document.createElement('canvas'); recCanvas.width = Math.round(Q.h * VW / H / 2) * 2; recCanvas.height = Q.h;
  // Safari は画面に置かれていないキャンバスから映像を取り出せないため、見えない位置に配置する
  recCanvas.style.cssText = 'position:fixed;left:0;top:0;width:2px;height:2px;opacity:0.01;pointer-events:none;z-index:-1';
  document.body.appendChild(recCanvas);
  rctx = recCanvas.getContext('2d'); rctx.imageSmoothingQuality = 'high';
  recDirty = true; renderRec();
  let vs = recCanvas.captureStream(0);
  recTrack = vs.getVideoTracks()[0] || null;
  if (!recTrack || typeof recTrack.requestFrame !== 'function'){
    vs.getTracks().forEach(t => t.stop());
    vs = recCanvas.captureStream(Q.fps); recTrack = null;
  }
  recFps = Q.fps; lastFrameT = 0;
  recStream = new MediaStream([...vs.getVideoTracks(), ...(micStream ? boostMic(micStream, +$('gainSel').value || 1) : [])]);
  const mime = ['video/mp4;codecs=avc1,mp4a.40.2', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm'].find(m => MediaRecorder.isTypeSupported(m)) || '';
  recMime = mime; recExt = /webm/.test(mime) ? 'webm' : 'mp4';
  recOpts = mime ? { mimeType: mime, videoBitsPerSecond: Q.vbr, audioBitsPerSecond: Q.abr } : {};
  segs = []; takeSeq = 0;
  await idbClearRec();
  try { startTake(); }
  catch (e){ toast('録画を開始できませんでした'); teardownRec(); recState = 'idle'; setRecUI(); return; }
  timerId = setInterval(tick, 250); tick(); setRecUI();
}
function teardownRec(){
  if (micStream) micStream.getTracks().forEach(t => t.stop());
  if (recStream) recStream.getTracks().forEach(t => t.stop());
  micStream = recStream = null;
  if (micNode){ try { micNode.disconnect(); } catch (e){} micNode = null; }
  if (recCanvas) recCanvas.remove(); recCanvas = null; rctx = null; recTrack = null;
  clearInterval(timerId); timerId = null;
}
async function stopRec(){
  if (recState === 'live'){ recState = 'busy'; setRecUI(); await finishTake(true); }
  recState = 'busy'; teardownRec(); setRecUI();
  if (!segs.length){ recState = 'idle'; setRecUI(); idbClearRec(); toast('録画された場面がありません'); return; }
  await buildVideo(segs.map(s => new Blob(s.chunks, { type: recMime || 'video/mp4' })));
  recState = 'idle'; setRecUI();
}
async function buildVideo(blobs){
  recBlob = null; recParts = null;
  toast('動画を仕上げています…', 60000);
  const type = (recMime || 'video/mp4').split(';')[0];
  try { recBlob = await MP4F.finalize(blobs, type); }                 // 普通のMP4（長さ情報つき）に組み直す
  catch (e1){
    console.error(e1);
    try { recBlob = await MP4.join(blobs, type); }                       // だめなら断片のままつなぐ
    catch (e2){ console.error(e2); recParts = blobs; recBlob = blobs[0]; } // それもだめなら場面ごとに
  }
  if (/webm/.test(recBlob.type || recMime)) recExt = 'webm';
  $('toast').classList.remove('show');
  showResult();
}
function showResult(){
  if (videoURL) URL.revokeObjectURL(videoURL);
  videoURL = URL.createObjectURL(recBlob);
  savedOnce = false;
  $('resultVideo').src = videoURL;
  const note = $('saveNote');
  if (recParts){ note.textContent = `場面をつなげられなかったため、${recParts.length}本の動画に分けて保存します（プレビューは1本目です）。`; note.classList.remove('hide'); }
  else note.classList.add('hide');
  $('discardBtn').textContent = '破棄して閉じる';
  $('resultDlg').showModal();
}
function closeResult(){
  $('resultVideo').removeAttribute('src'); $('resultVideo').load();
  recBlob = null; recParts = null; segs = []; $('resultDlg').close(); idbClearRec();
}
$('discardBtn').onclick = () => { if (savedOnce) closeResult(); else armConfirm($('discardBtn'), 'もう一度押すと破棄', closeResult); };
async function saveOne(blob, name, url){
  let dl = null;
  try { dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch (e){ dl = null; }
  if (dl){
    try { await dl.save({ filename: name, data: blob }); return 'ok'; }
    catch (err){ return err && err.code === 'declined' ? 'cancel' : 'fail'; }
  }
  const file = new File([blob], name, { type: blob.type || (recExt === 'webm' ? 'video/webm' : 'video/mp4') });
  if (navigator.canShare && navigator.canShare({ files: [file] })){
    try { await navigator.share({ files: [file] }); return 'ok'; }
    catch (err){ if (err && err.name === 'AbortError') return 'cancel'; }
  }
  try {
    const u = url || URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = u; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    if (!url) setTimeout(() => URL.revokeObjectURL(u), 60000);
    return 'ok';
  } catch (e){ return 'fail'; }
}
$('saveBtn').onclick = async () => {
  const note = $('saveNote');
  const d = new Date(), z = n => String(n).padStart(2, '0');
  const stem = `板書_${d.getFullYear()}${z(d.getMonth()+1)}${z(d.getDate())}_${z(d.getHours())}${z(d.getMinutes())}`;
  const list = recParts ? recParts.map((b, i) => [b, `${stem}_${i + 1}.${recExt}`, null]) : [[recBlob, `${stem}.${recExt}`, videoURL]];
  for (const [b, name, url] of list){
    const r = await saveOne(b, name, url);
    if (r === 'cancel') return;
    if (r === 'fail'){ note.textContent = '保存できませんでした。もう一度お試しください。'; note.classList.remove('hide'); return; }
  }
  savedOnce = true; $('discardBtn').textContent = '閉じる';
  toast('動画を保存しました');
};

/* ---------- 録画の途中保存と復元 ---------- */
const pad6 = n => String(n).padStart(6, '0');
async function recTx(mode, fn){
  try {
    const db = await openDB();
    return await new Promise((res, rej) => {
      const tx = db.transaction('rec', mode); const st = tx.objectStore('rec'); let out;
      const r = fn(st); if (r) r.onsuccess = () => { out = r.result; };
      tx.oncomplete = () => res(out); tx.onerror = () => rej(tx.error);
    });
  } catch (e){ return undefined; }
}
function idbPutChunk(id, i, blob){ recTx('readwrite', st => st.put(blob, `c:${pad6(id)}:${pad6(i)}`)); }
function idbDeleteTake(id){ recTx('readwrite', st => st.delete(IDBKeyRange.bound(`c:${pad6(id)}:`, `c:${pad6(id)}:\uffff`))); }
function idbClearRec(){ return recTx('readwrite', st => st.clear()); }
function saveMeta(){
  recTx('readwrite', st => st.put({ ids: segs.map(s => s.id).concat(take ? [take.id] : []), mime: recMime, ext: recExt, ms: totalMs() }, 'meta'));
}
async function checkRecovery(){
  const meta = await recTx('readonly', st => st.get('meta'));
  if (!meta || !meta.ids || !meta.ids.length) return;
  $('recoverText').textContent = `前回の録画（約${Math.max(1, Math.round((meta.ms || 0) / 60000))}分）が保存されないまま残っています。動画にしますか？`;
  $('recoverDlg').showModal();
  $('recoverDiscard').onclick = () => armConfirm($('recoverDiscard'), 'もう一度押すと破棄', () => { idbClearRec(); $('recoverDlg').close(); });
  $('recoverOk').onclick = async () => {
    $('recoverDlg').close();
    const blobs = [];
    for (const id of meta.ids){
      const parts = await recTx('readonly', st => st.getAll(IDBKeyRange.bound(`c:${pad6(id)}:`, `c:${pad6(id)}:\uffff`)));
      if (parts && parts.length) blobs.push(new Blob(parts, { type: meta.mime || 'video/mp4' }));
    }
    if (!blobs.length){ toast('復元できる映像がありませんでした'); idbClearRec(); return; }
    recMime = meta.mime || ''; recExt = meta.ext || 'mp4';
    await buildVideo(blobs);
  };
}

/* ---------- ライブラリ（ボードの保存・呼び出し） ---------- */
async function libTx(mode, fn){
  try {
    const db = await openDB();
    return await new Promise((res, rej) => {
      const tx = db.transaction('lib', mode); let out; const r = fn(tx.objectStore('lib'));
      if (r) r.onsuccess = () => { out = r.result; };
      tx.oncomplete = () => res(out); tx.onerror = () => rej(tx.error);
    });
  } catch (e){ toast('ライブラリを使えませんでした（保存領域が使えない状態です）'); return undefined; }
}
const hasContent = () => pages.some(p => p.items.length);
async function makeThumb(){
  const tw = 320, th = Math.round(tw * H / VW), c = document.createElement('canvas'); c.width = tw; c.height = th;
  const g = c.getContext('2d'), k = tw / VW;
  const items = pages[0].items;
  await Promise.all(items.filter(i => i.type === 'image').map(i => new Promise(r => { const im = getImg(i.src); if (im.complete) r(); else { im.addEventListener('load', r, { once: true }); im.addEventListener('error', r, { once: true }); } })));
  g.setTransform(k, 0, 0, k, -X0 * k, 0);
  const keepDrag = drag; drag = null; renderItems(g, items); drag = keepDrag;
  return c.toDataURL('image/jpeg', 0.75);
}
const fmtDate = t => { const d = new Date(t), z = n => String(n).padStart(2, '0'); return `${d.getMonth() + 1}/${d.getDate()} ${z(d.getHours())}:${z(d.getMinutes())}`; };
async function libRender(){
  const list = (await libTx('readonly', st => st.getAll())) || [];
  list.sort((a, b) => b.updated - a.updated);
  const box = $('libList'); box.innerHTML = '';
  if (!list.length){ box.innerHTML = '<div class="libEmpty">まだ保存されたボードはありません。名前を付けて「今のボードを保存」を押すと、ここに並びます。</div>'; return; }
  for (const e of list){
    const el = document.createElement('div'); el.className = 'libItem' + (e.id === libCurId ? ' cur' : '');
    el.innerHTML = `<img alt=""><div class="nm"></div><div class="meta"></div><div class="act"><button class="primary" data-a="open">開く</button><button data-a="del">削除</button></div>`;
    el.querySelector('img').src = e.thumb || ''; el.querySelector('.nm').textContent = e.name;
    el.querySelector('.meta').textContent = `${e.pages.length}ページ・${fmtDate(e.updated)}`;
    const ob = el.querySelector('[data-a="open"]'), db = el.querySelector('[data-a="del"]');
    ob.onclick = () => { const go = () => libOpen(e); if (libDirty && hasContent() && e.id !== libCurId) armConfirm(ob, '今のボードは消えます。もう一度で開く', go); else go(); };
    db.onclick = () => armConfirm(db, 'もう一度で削除', async () => { await libTx('readwrite', st => st.delete(e.id)); if (libCurId === e.id) libCurId = null; libRender(); });
    box.appendChild(el);
  }
}
function libOpen(e){
  pages = e.pages.map(p => ({ items: p.items.slice(), undo: [], redo: [] }));
  cur = 0; grid = !!e.grid; $('gridBtn').setAttribute('aria-pressed', grid);
  setDark(!!e.dark); setRatio('4:3'); sel = []; drawing = null; lasso = null;
  changed(); libCurId = e.id; libDirty = false; $('libName').value = e.name; clearTimeout(saveT); saveNow();
  $('libDlg').close(); toast(`「${e.name}」を開きました`);
}
async function libSave(){
  const name = $('libName').value.trim() || `ボード ${fmtDate(Date.now())}`;
  const list = (await libTx('readonly', st => st.getAll())) || [];
  const same = list.find(x => x.name === name);
  const doSave = async () => {
    const e = { id: same ? same.id : 'b' + Date.now().toString(36), name, updated: Date.now(),
      pages: pages.map(p => ({ items: p.items })), grid, dark, ratio: VW === 1440 ? '4:3' : '16:9', thumb: await makeThumb() };
    await libTx('readwrite', st => st.put(e));
    libCurId = e.id; libDirty = false; $('libName').value = name; clearTimeout(saveT); saveNow(); toast(`「${name}」を保存しました`); libRender();
  };
  if (same && same.id !== libCurId) armConfirm($('libSaveBtn'), '同じ名前があります。もう一度で上書き', doSave);
  else doSave();
}
$('libBtn').onclick = () => { libRender(); $('libDlg').showModal(); };
$('libClose').onclick = () => $('libDlg').close();
$('libSaveBtn').onclick = libSave;
$('libName').addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); libSave(); } });
$('libNewBtn').onclick = () => {
  const go = () => {
    pages = [newPage()]; cur = 0; sel = []; changed(); libCurId = null; libDirty = false; $('libName').value = ''; clearTimeout(saveT); saveNow();
    $('libDlg').close(); toast('新しいボードにしました');
  };
  if (libDirty && hasContent()) armConfirm($('libNewBtn'), '今のボードは消えます。もう一度で新規', go); else go();
};

/* ---------- autosave (IndexedDB) ---------- */
let dbP = null;
function openDB(){
  if (!dbP) dbP = new Promise((res, rej) => {
    const r = indexedDB.open('bansho-recorder', 4);
    r.onupgradeneeded = () => {
      const db = r.result;
      if (!db.objectStoreNames.contains('kv')) db.createObjectStore('kv');
      if (!db.objectStoreNames.contains('rec')) db.createObjectStore('rec');
      if (!db.objectStoreNames.contains('lib')) db.createObjectStore('lib', { keyPath: 'id' });
      if (!db.objectStoreNames.contains('img')) db.createObjectStore('img');
    };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  return dbP;
}
// 自動保存：PDF・画像の中身は大きいので、初めて出てきたときに1回だけ別の場所へ保存し、
// ふだんの保存では「どの画像か」の番号だけを書く（毎回MB単位のデータを書かない）
let saveT;
const imgKey = new Map();   // 画像の中身（src） → 保存用の番号
function scheduleSave(){ clearTimeout(saveT); saveT = setTimeout(saveNow, 1500); }
async function saveNow(){
  if (activeId !== null || drawing){ scheduleSave(); return; }   // 書いている最中は保存しない
  try {
    const db = await openDB();
    const fresh = [];
    const slim = it => {
      if (it.type !== 'image') return it;
      let k = imgKey.get(it.src);
      if (!k){ k = 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); imgKey.set(it.src, k); fresh.push([k, it.src]); }
      const { src, ...rest } = it; return { ...rest, ref: k };
    };
    const data = { v: 2, pages: pages.map(p => ({ items: p.items.map(slim) })), cur, grid, dark, ratio: VW === 1440 ? '4:3' : '16:9', libCurId, libDirty, libName: $('libName').value };
    await new Promise((res, rej) => {
      const tx = db.transaction(['kv', 'img'], 'readwrite');
      for (const [k, src] of fresh) tx.objectStore('img').put(src, k);
      tx.objectStore('kv').put(data, 'project');
      tx.oncomplete = res; tx.onerror = () => rej(tx.error);
    });
  } catch (e){ /* storage unavailable: keep working in memory */ }
}
async function load(){
  try {
    const db = await openDB();
    const data = await new Promise((res, rej) => { const r = db.transaction('kv').objectStore('kv').get('project'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
    if (data && data.pages && data.pages.length){
      // 番号で保存した画像を中身に戻す。どのページからも使われなくなった画像はここで片付ける
      const stored = await new Promise((res, rej) => {
        const out = new Map(), tx = db.transaction('img'), req = tx.objectStore('img').openCursor();
        req.onsuccess = () => { const c = req.result; if (c){ out.set(c.key, c.value); c.continue(); } };
        tx.oncomplete = () => res(out); tx.onerror = () => rej(tx.error);
      });
      const used = new Set();
      for (const p of data.pages) p.items = (p.items || []).map(it => {
        if (it.type !== 'image' || !it.ref) return it;
        const src = stored.get(it.ref); if (!src) return null;
        used.add(it.ref); imgKey.set(src, it.ref);
        const { ref, ...rest } = it; return { ...rest, src };
      }).filter(Boolean);
      const unused = [...stored.keys()].filter(k => !used.has(k));
      if (unused.length){ const tx = db.transaction('img', 'readwrite'); for (const k of unused) tx.objectStore('img').delete(k); }
      pages = data.pages.map(p => ({ items: p.items || [], undo: [], redo: [] }));
      cur = Math.min(data.cur || 0, pages.length - 1); grid = !!data.grid;
      $('gridBtn').setAttribute('aria-pressed', grid);
      setDark(!!data.dark); setRatio('4:3');   // ボードは4:3に固定
      libCurId = data.libCurId || null; $('libName').value = data.libName || ''; libDirty = !!data.libDirty;
    }
  } catch (e){}
  layerDirty = needsRender = true; updateUI();
}

fit(); updateUI(); load().then(checkRecovery); requestAnimationFrame(loop);
})();
